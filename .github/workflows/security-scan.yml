name: Security Scan

on:
  schedule:
    - cron: "0 8 * * 3"
  workflow_dispatch:

permissions:
  security-events: write

jobs:
  scan:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      TRIVY_PLATFORM: linux/${{ matrix.arch }}
    steps:
      - id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0 # renovate: depName=aquasecurity/trivy
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          image-ref: ghcr.io/cfgate/cfgate:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.trivy.conclusion != 'skipped'
        with:
          sarif_file: trivy-results.sarif
          category: published-image-${{ matrix.arch }}
