name: CI

on:
  push:
    branches: [main, dev]
    paths:
      - "cmd/**"
      - "api/**"
      - "internal/**"
      - "config/**"
      - "go.mod"
      - "go.sum"
      - "mise.toml"
      - ".codecov.yml"
      - "Dockerfile"
      - ".golangci.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "cmd/**"
      - "api/**"
      - "internal/**"
      - "config/**"
      - "go.mod"
      - "go.sum"
      - "mise.toml"
      - ".codecov.yml"
      - "Dockerfile"
      - ".golangci.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: mise run lint

  test:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: mise run test

  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: mise run build
      - run: IMG=cfgate:ci mise run docker:build

  coverage:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: mise run test:cover
      - uses: codecov/codecov-action@v6
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          files: out/coverage/unit.coverprofile
          flags: unit
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
