name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: cfgate-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  resolve:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      date: ${{ steps.source.outputs.date }}
      level: ${{ steps.channel.outputs.level }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
      is-latest: ${{ steps.channel.outputs.is-latest }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: source
        name: Resolve immutable release source
        run: |
          .github/scripts/validate-release-ref.sh "$RELEASE_TAG" "$RELEASE_SHA"
          {
            echo "sha=$RELEASE_SHA"
            echo "tag=$RELEASE_TAG"
            echo "version=${RELEASE_TAG#v}"
            echo "date=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - id: channel
        run: |
          VERSION="$RELEASE_VERSION"
          if [[ "$VERSION" == *"-alpha."* ]]; then
            {
              echo "level=alpha"
              echo "prerelease=true"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *"-beta."* ]]; then
            {
              echo "level=beta"
              echo "prerelease=true"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *"-rc."* ]]; then
            {
              echo "level=rc"
              echo "prerelease=true"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "level=stable"
              echo "prerelease=false"
            } >> "$GITHUB_OUTPUT"
          fi
          IS_LATEST=false
          if [[ "$VERSION" != *"-"* ]]; then
            IS_LATEST=true
          else
            HAS_STABLE=false
            HAS_BETA=false
            HAS_RC=false
            for tag in $(git tag -l 'v*' | grep -v "^${RELEASE_TAG}$"); do
              v="${tag#v}"
              [[ "$v" != *"-"* ]] && HAS_STABLE=true
              [[ "$v" == *"-beta."* ]] && HAS_BETA=true
              [[ "$v" == *"-rc."* ]] && HAS_RC=true
            done
            if [[ "$VERSION" == *"-alpha."* && "$HAS_BETA" == "false" && "$HAS_RC" == "false" && "$HAS_STABLE" == "false" ]]; then
              IS_LATEST=true
            elif [[ "$VERSION" == *"-beta."* && "$HAS_STABLE" == "false" && "$HAS_RC" == "false" ]]; then
              IS_LATEST=true
            elif [[ "$VERSION" == *"-rc."* && "$HAS_STABLE" == "false" ]]; then
              IS_LATEST=true
            fi
          fi
          echo "is-latest=$IS_LATEST" >> "$GITHUB_OUTPUT"

  e2e:
    needs: resolve
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      MISE_SOPS_AGE_KEY: ${{ secrets.MISE_SOPS_AGE_KEY }}
      MISE_SOPS_ROPS: "true"
      E2E_USE_EXISTING_CLUSTER: "false"
      E2E_PROCS: "2"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@v5

      - name: Validate release E2E secrets
        run: mise run e2e:preflight

      - name: Run release E2E
        run: mise run e2e

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-e2e-${{ github.ref_name }}
          path: |
            out/reports/e2e.json
            out/coverage/e2e.coverprofile
          if-no-files-found: warn

      - name: Upload E2E coverage to Codecov
        if: always() && hashFiles('out/coverage/e2e.coverprofile') != ''
        uses: codecov/codecov-action@v7
        with:
          files: out/coverage/e2e.coverprofile
          flags: e2e,release
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  quality:
    needs: resolve
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: mise run format:check
      - run: mise run lint
      - run: mise run test
      - run: mise run test:offline

  build-and-scan:
    needs: resolve
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.verify.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - name: Keep emulation registrations on the runner host
        run: |
          # Without a host mount, binfmt registrations can disappear when the
          # privileged QEMU installer container exits on a fresh runner.
          if ! mountpoint -q /proc/sys/fs/binfmt_misc; then
            sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
          fi
          mountpoint /proc/sys/fs/binfmt_misc
      - uses: docker/setup-qemu-action@v4
        id: qemu
        with:
          platforms: arm64
      - name: Verify ARM64 emulation survived setup
        env:
          EMULATED_PLATFORMS: ${{ steps.qemu.outputs.platforms }}
        run: |
          grep -Fx enabled /proc/sys/fs/binfmt_misc/qemu-aarch64
          grep -Eq '^flags:.*F' /proc/sys/fs/binfmt_misc/qemu-aarch64
          case ",$EMULATED_PLATFORMS," in
            *,linux/arm64,*) ;;
            *) echo "::error::ARM64 emulation is unavailable after QEMU setup"; exit 1 ;;
          esac
      - uses: useblacksmith/setup-docker-builder@v1
      - name: Install OCI archive tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ needs.resolve.outputs.is-latest }}
            type=raw,value=${{ needs.resolve.outputs.level }},enable=${{ needs.resolve.outputs.prerelease == 'true' }}
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/cfgate/cfgate/main/README.md
            io.artifacthub.package.logo-url=https://cfgate.io/icon.png
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.prerelease=${{ needs.resolve.outputs.prerelease }}
            io.artifacthub.package.category=networking
            io.artifacthub.package.keywords=kubernetes,cloudflare,gateway-api,tunnel,dns,operator,controller
            io.artifacthub.package.maintainers=[{"name":"inherent-design","email":"mannie@inherent.design"}]
            org.opencontainers.image.vendor=inherent.design
            org.opencontainers.image.documentation=https://cfgate.io

      - name: Verify generated code is current
        run: |
          mise run codegen
          git diff --exit-code -- api config
      - id: build
        name: Build both architectures without publication
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.resolve.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.resolve.outputs.version }}
            COMMIT=${{ needs.resolve.outputs.sha }}
            BUILD_DATE=${{ needs.resolve.outputs.date }}
          outputs: type=oci,dest=cfgate.oci.tar
          provenance: mode=max
          sbom: true
      - id: verify
        name: Verify and smoke-test exact platform artifacts
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_BUILD_DATE: ${{ needs.resolve.outputs.date }}
        run: .github/scripts/verify-release-images.sh
      - id: scan-amd64
        name: Gate AMD64 image before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0 # renovate: depName=aquasecurity/trivy
          input: release-images/amd64
          format: json
          output: trivy-amd64.json
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: CRITICAL,HIGH
      - id: scan-arm64
        name: Gate ARM64 image before publication
        if: always() && steps.verify.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0 # renovate: depName=aquasecurity/trivy
          input: release-images/arm64
          format: json
          output: trivy-arm64.json
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: CRITICAL,HIGH
      - name: Convert scan reports
        if: always() && steps.verify.outcome == 'success'
        run: |
          mkdir -p sarif
          for arch in amd64 arm64; do
            if [[ -f "trivy-$arch.json" ]]; then
              trivy convert --format sarif "trivy-$arch.json" | jq --arg arch "$arch" '.runs[].automationDetails.id = ("release-images/" + $arch + "/")' > "sarif/trivy-$arch.sarif"
            fi
          done
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('sarif/*.sarif') != ''
        with:
          sarif_file: sarif
          category: release-images
      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-scan-evidence
          path: |
            trivy-*.json
            release-images/index.json
            release-images/*-manifest.json
            release-images/*-attestation.json
            release-images/*-version.txt
            release-images/*-startup.jsonl
          if-no-files-found: warn
      - name: Upload checked image archive
        uses: actions/upload-artifact@v7
        with:
          name: release-image
          path: |
            cfgate.oci.tar
            cfgate.oci.tar.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  release:
    needs: [resolve, quality, e2e, build-and-scan]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      EXPECTED_DIGEST: ${{ needs.build-and-scan.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag still identifies checked source
        run: .github/scripts/validate-release-ref.sh "$RELEASE_TAG" "$RELEASE_SHA"
      - uses: jdx/mise-action@v5
      - name: Install OCI archive tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo
      - uses: actions/download-artifact@v8
        with:
          name: release-image
      - name: Verify checked archive
        run: |
          sha256sum --check cfgate.oci.tar.sha256
          skopeo inspect --raw oci-archive:cfgate.oci.tar > index.json
          test "$(skopeo manifest-digest index.json)" = "$EXPECTED_DIGEST"
      - name: Login for artifact promotion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin "$REGISTRY"
      - name: Recheck current tag before promotion
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_SHA"
          .github/scripts/validate-release-ref.sh "$RELEASE_TAG" "$RELEASE_SHA"
      - id: push
        name: Promote checked OCI index without rebuilding
        env:
          RELEASE_TAGS: ${{ needs.build-and-scan.outputs.tags }}
        run: |
          while IFS= read -r ref; do
            [[ "$ref" == "$REGISTRY/$IMAGE_NAME:"* ]]
            skopeo copy --all --preserve-digests oci-archive:cfgate.oci.tar "docker://$ref"
            skopeo inspect --raw "docker://$ref" > remote-index.json
            test "$(skopeo manifest-digest remote-index.json)" = "$EXPECTED_DIGEST"
          done <<< "$RELEASE_TAGS"
          echo "digest=$EXPECTED_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Attest container provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

      - name: Generate manifests
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.resolve.outputs.version }} mise run manifests

      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}

      - uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.content }}
          prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
          files: |
            dist/install.yaml
            dist/crds.yaml
            dist/crds/*.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "## Release Summary"
            echo "- Version: ${{ needs.resolve.outputs.version }}"
            echo "- Channel: ${{ needs.resolve.outputs.level }}"
            echo "- Latest: ${{ needs.resolve.outputs.is-latest }}"
            echo "- Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.resolve.outputs.version }}"
            echo "- Digest: ${{ steps.push.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: oras-project/setup-oras@v2

      - name: Push Artifact Hub metadata
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin
          oras push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
