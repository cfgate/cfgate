apiVersion: cfgate.io/v1alpha1
kind: CloudflareOriginPolicy
metadata:
  labels:
    app.kubernetes.io/name: cfgate
    app.kubernetes.io/managed-by: kustomize
  name: cloudflareoriginpolicy-sample
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: app
      namespace: ""
      sectionName: ""
  origin:
    protocol: https
    tls:
      originServerName: app.internal
      caPoolRef:
        name: internal
    http:
      httpHostHeader: app.internal
    connection:
      connectTimeout: 10s
