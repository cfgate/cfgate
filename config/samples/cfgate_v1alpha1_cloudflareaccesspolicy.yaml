apiVersion: cfgate.io/v1alpha1
kind: CloudflareAccessPolicy
metadata:
  name: internal-apps
  namespace: cfgate-system
spec:
  cloudflareRef:
    name: cloudflare-api-token
    accountId: 00000000000000000000000000000000
  name: allow-employees
  decision: allow
  include:
    - emailDomain:
        domain: company.com
  serviceTokens:
    - name: ci-token
      duration: 8760h
      secretRef:
        name: ci-access-token
