                      enum:
                      - HTTPRoute
                      maxLength: 63
                      type: string
                    name:
                      description: Name is the name of the target resource.
                      maxLength: 253
                      minLength: 1
                      type: string
                    namespace:
                      default: ""
                      description: |-
                        Namespace is the namespace of the target resource.
                        Cross-namespace targeting requires ReferenceGrant.
                      maxLength: 253
                      type: string
                    sectionName:
                      default: ""
                      description: SectionName targets a named HTTPRoute rule.
                      maxLength: 253
                      type: string
                  required:
                  - group
                  - kind
                  - name
                  - namespace
                  - sectionName
                  type: object
                  x-kubernetes-validations:
                  - message: group must be gateway.networking.k8s.io
                    rule: self.group == 'gateway.networking.k8s.io'
                  - message: kind must be HTTPRoute
                    rule: self.kind == 'HTTPRoute'
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - group
                - kind
                - name
                - namespace
                - sectionName
                x-kubernetes-list-type: map
            required:
            - targetRefs
            type: object
          status:
            description: CloudflareOriginPolicyStatus defines observed origin policy
              state.
            properties:
              ancestors:
                description: Ancestors contains status for each targetRef.
                items:
                  description: |-
                    PolicyAncestorStatus describes the policy attachment status for a specific target.

                    PolicyAncestorStatus follows the Gateway API PolicyAncestorStatus pattern to report
                    per-target attachment status. Each target reference in the spec has a corresponding
                    ancestor status entry showing whether the policy was successfully attached.
                  properties:
                    ancestorRef:
                      description: AncestorRef identifies the target.
                      properties:
                        group:
                          default: gateway.networking.k8s.io
                          description: Group is the API group of the target resource.
                          maxLength: 253
                          type: string
                        kind:
                          description: Kind is the kind of the target resource.
                          enum:
                          - Gateway
                          - HTTPRoute
                          maxLength: 63
                          type: string
                        name:
                          description: Name is the name of the target resource.
                          maxLength: 253
                          minLength: 1
                          type: string
                        namespace:
                          description: |-
                            Namespace is the namespace of the target resource.
                            Cross-namespace targeting requires ReferenceGrant.
                          maxLength: 253
                          type: string
                        sectionName:
                          description: SectionName targets specific listener (Gateway)
                            or rule (Route).
                          maxLength: 253
                          type: string
                      required:
                      - group
                      - kind
                      - name
                      type: object
                      x-kubernetes-validations:
                      - message: group must be gateway.networking.k8s.io
                        rule: self.group == 'gateway.networking.k8s.io'
                      - message: kind must be Gateway or HTTPRoute
                        rule: self.kind in ['Gateway', 'HTTPRoute']
                    conditions:
                      description: Conditions for this specific target.
                      items:
                        description: Condition contains details for one aspect of
                          the current state of this API Resource.
                        properties:
                          lastTransitionTime:
                            description: |-
                              lastTransitionTime is the last time the condition transitioned from one status to another.
                              This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                            format: date-time
                            type: string
                          message:
                            description: |-
                              message is a human readable message indicating details about the transition.
                              This may be an empty string.
                            maxLength: 32768
                            type: string
                          observedGeneration:
                            description: |-
                              observedGeneration represents the .metadata.generation that the condition was set based upon.
                              For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                              with respect to the current state of the instance.
                            format: int64
                            minimum: 0
                            type: integer
                          reason:
                            description: |-
                              reason contains a programmatic identifier indicating the reason for the condition's last transition.
                              Producers of specific condition types may define expected values and meanings for this field,
                              and whether the values are considered a guaranteed API.
                              The value should be a CamelCase string.
                              This field may not be empty.
                            maxLength: 1024
                            minLength: 1
                            pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                            type: string
                          status:
                            description: status of the condition, one of True, False,
                              Unknown.
                            enum:
                            - "True"
                            - "False"
                            - Unknown
                            type: string
                          type:
                            description: type of condition in CamelCase or in foo.example.com/CamelCase.
                            maxLength: 316
                            pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                            type: string
                        required:
                        - lastTransitionTime
                        - message
                        - reason
                        - status
                        - type
                        type: object
                      maxItems: 8
                      type: array
                    controllerName:
                      description: ControllerName identifies the controller managing
                        this attachment.
                      maxLength: 253
                      type: string
                  required:
                  - ancestorRef
                  - controllerName
                  type: object
                maxItems: 64
                type: array
              attachedTargets:
                description: AttachedTargets is the count of successfully accepted
                  Gateway API targets.
                format: int32
                type: integer
              conditions:
                description: Conditions describe current state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
