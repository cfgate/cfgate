              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CloudflareOriginPolicySpec defines origin behavior for Gateway API targets.

              CloudflareOriginPolicy is a cfgate-specific Direct Policy Attachment surface for
              origin settings that do not have a portable Gateway API policy. BackendTLSPolicy
              remains preferred for standard backend TLS validation when it fits.
            properties:
              origin:
                description: Origin defines cloudflared origin behavior for the selected
                  targets.
                properties:
                  caPoolRef:
                    description: |-
                      CAPoolRef selects a named origin CA pool managed by cfgate.
                      Deprecated: use tls.caPoolRef.
                    properties:
                      name:
                        description: Name is the spec.originCAPools name on the CloudflareTunnel.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                    - name
                    type: object
                  connectTimeout:
                    description: |-
                      ConnectTimeout is the timeout for establishing a new TCP connection to the origin.
                      Deprecated: use connection.connectTimeout.
                    pattern: ^[0-9]+(s|m|h)$
                    type: string
                  connection:
                    description: Connection contains origin connection settings.
                    properties:
                      connectTimeout:
                        description: ConnectTimeout is the timeout for establishing
                          a new TCP connection to the origin.
                        pattern: ^[0-9]+(s|m|h)$
                        type: string
                    type: object
                  h2cOrigin:
                    description: H2cOrigin makes cloudflared connect to cleartext
                      HTTP/2 origins.
                    type: boolean
                  http:
                    description: HTTP contains origin HTTP settings.
                    properties:
                      disableChunkedEncoding:
                        description: DisableChunkedEncoding disables chunked transfer
                          encoding to HTTP/1.1 origins.
                        type: boolean
                      httpHostHeader:
                        description: HTTPHostHeader sets the HTTP Host header on requests
                          sent to the backend Service.
                        maxLength: 253
                        type: string
                    type: object
                  http2Origin:
                    description: HTTP2Origin makes cloudflared connect to HTTPS origins
                      with HTTP/2.
                    type: boolean
                  httpHostHeader:
                    description: |-
                      HTTPHostHeader sets the HTTP Host header sent to the backend Service.
                      Deprecated: use http.httpHostHeader.
                    maxLength: 253
                    type: string
                  noTLSVerify:
                    description: |-
                      NoTLSVerify disables TLS verification for HTTPS origins.
                      Deprecated: use tls.noTLSVerify.
                    type: boolean
                  originServerName:
                    description: |-
                      OriginServerName is the SNI and expected certificate hostname for HTTPS origins.
                      Deprecated: use tls.originServerName.
                    maxLength: 253
                    type: string
                  protocol:
                    description: Protocol is the backend Service scheme. Empty defaults
                      to HTTP.
                    enum:
                    - http
                    - https
                    type: string
                  tls:
                    description: TLS contains origin TLS settings.
                    properties:
                      caPoolRef:
                        description: CAPoolRef selects a named origin CA pool managed
                          by cfgate.
                        properties:
                          name:
                            description: Name is the spec.originCAPools name on the
                              CloudflareTunnel.
                            maxLength: 63
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                        required:
                        - name
                        type: object
                      matchSNItoHost:
                        description: MatchSNIToHost makes cloudflared set SNI to the
                          incoming request hostname.
                        type: boolean
                      noTLSVerify:
                        description: NoTLSVerify disables TLS certificate verification
                          for HTTPS origins.
                        type: boolean
                      originServerName:
                        description: |-
                          OriginServerName is the hostname cloudflared expects on the origin certificate
                          and uses for SNI when connecting to HTTPS origins.
                        maxLength: 253
                        type: string
                      tlsTimeout:
                        description: TLSTimeout is the timeout for completing the
                          TLS handshake.
                        pattern: ^[0-9]+(s|m|h)$
                        type: string
                    type: object
                type: object
                x-kubernetes-validations:
                - message: http2Origin and h2cOrigin are mutually exclusive
                  rule: '!(self.http2Origin && self.h2cOrigin)'
              targetRefs:
