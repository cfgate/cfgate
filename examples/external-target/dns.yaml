apiVersion: cfgate.io/v1alpha1
kind: CloudflareDNS
metadata:
  name: external-dns
  namespace: cfgate-system
spec:
  externalTarget:
    type: A
    value: "203.0.113.10"
  cloudflare:
    accountId: "your-account-id"
    secretRef:
      name: cloudflare-credentials
  zones:
    - name: example.com
  source:
    explicit:
      - hostname: app.example.com
        proxied: true
        ttl: 1
      - hostname: api.example.com
        proxied: false
        ttl: 300
  policy: sync
  ownership:
    txtRecord:
      enabled: true
      prefix: _cfgate
  cleanupPolicy:
    deleteOnRouteRemoval: true
    deleteOnResourceRemoval: true
