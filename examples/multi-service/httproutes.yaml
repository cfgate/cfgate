apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: demo
spec:
  parentRefs:
    - name: cloudflare-tunnel
      namespace: cfgate-system
  hostnames:
    - api.example.com
  rules:
    - backendRefs:
        - name: api
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: demo
spec:
  parentRefs:
    - name: cloudflare-tunnel
      namespace: cfgate-system
  hostnames:
    - web.example.com
  rules:
    - name: root
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 80
    - name: admin
      matches:
        - path:
            type: PathPrefix
            value: /admin
      backendRefs:
        - name: admin
          port: 80
    - name: repos
      matches:
        - path:
            type: PathPrefix
            value: /repos
      backendRefs:
        - name: api
          port: 80
