apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-demo-access-apps
  namespace: cfgate-system
spec:
  from:
    - group: cfgate.io
      kind: CloudflareAccessApplication
      namespace: demo
  to:
    - group: cfgate.io
      kind: CloudflareAccessPolicy
    - group: cfgate.io
      kind: CloudflareTunnel
      name: multi-tunnel
    - group: ""
      kind: Secret
      name: cloudflare-credentials
