apiVersion: cfgate.io/v1alpha1
kind: CloudflareAccessPolicy
metadata:
  name: allow-admins
  namespace: cfgate-system
spec:
  cloudflareRef:
    name: cloudflare-credentials
    accountId: "your-account-id"
  name: allow-admins
  decision: allow
  include:
    - email:
        addresses:
          - admin@company.com
---
apiVersion: cfgate.io/v1alpha1
kind: CloudflareAccessPolicy
metadata:
  name: allow-repos
  namespace: cfgate-system
spec:
  cloudflareRef:
    name: cloudflare-credentials
    accountId: "your-account-id"
  name: allow-repos
  decision: allow
  include:
    - emailDomain:
        domain: company.com
